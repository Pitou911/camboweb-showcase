<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f9" />
    <meta name="description" content="CamboWeb is a website builder in Phnom Penh. We build business websites, booking systems and POS for Cambodian businesses, in Khmer and English. Try our live templates." />
    <link rel="canonical" href="https://cambo-web.com/" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Link previews (Facebook, Telegram, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CamboWeb" />
    <meta property="og:url" content="https://cambo-web.com/" />
    <meta property="og:title" content="CamboWeb: business websites and POS systems in Cambodia" />
    <meta property="og:description" content="A website builder in Phnom Penh. Try our live website and POS templates before you buy." />
    <meta property="og:image" content="https://cambo-web.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="km_KH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cambo-web.com/og.jpg" />

    <!-- Business details for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "CamboWeb",
        "url": "https://cambo-web.com/",
        "logo": "https://cambo-web.com/img/camboweb-pfp-neon-black.png",
        "image": "https://cambo-web.com/og.jpg",
        "description": "Website builder in Phnom Penh building business websites, POS systems and business software for Cambodian businesses.",
        "address": { "@type": "PostalAddress", "addressLocality": "Phnom Penh", "addressCountry": "KH" },
        "areaServed": { "@type": "Country", "name": "Cambodia" },
        "availableLanguage": ["km", "en"],
        "knowsAbout": ["Website design", "Booking systems", "POS systems", "Business software", "E-invitations"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400..800&family=Kantumruy+Pro:wght@300..700&family=Lexend:wght@300;700&family=Battambang:wght@400;700&family=Italianno&display=swap" rel="stylesheet" />
    <script>
      // Set theme + language before the first paint, so there is no flash.
      try {
        var t = localStorage.getItem('cw-theme'), l = localStorage.getItem('cw-lang');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.lang = l === 'kh' ? 'kh' : 'en';
      } catch (e) {}
    </script>
    <title>CamboWeb | Business Websites &amp; POS Systems in Phnom Penh, Cambodia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
