<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f9" />
    <meta name="description" content="CamboWeb is a web studio in Phnom Penh. Try live invitation and website templates, or see the custom systems we build for Cambodian businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300..700&family=Lexend:wght@300;700&family=Battambang:wght@400;700&family=Italianno&display=swap" rel="stylesheet" />
    <script>
      // Set theme + language before the first paint, so there is no flash.
      try {
        var t = localStorage.getItem('cw-theme'), l = localStorage.getItem('cw-lang');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.lang = l === 'kh' ? 'kh' : 'en';
      } catch (e) {}
    </script>
    <title>CamboWeb · Websites, e-invitations and business systems in Phnom Penh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
